services:
  # Main application (Backend + Frontend + Nginx)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hwdc-mcp-league
    env_file: .env.docker
    ports:
      - "${EXTERNAL_PORT:-8080}:8080"
    environment:
      # Fixed configuration that doesn't need to be in .env.docker
      - HOST=0.0.0.0
      - MCP_TIMEOUT_SECONDS=60

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    # Optional: Mount volumes for development
    # volumes:
    #   - ./backend:/app/backend
    #   - ./frontend:/app/frontend
